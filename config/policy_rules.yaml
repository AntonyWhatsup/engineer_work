version: "2026.08-demo"
artifact_version: "1.0"
decision_threshold: 0.42
risk_bands:
  lower_risk_max: 0.20
  elevated_risk_max: 0.42
messages:
  disclaimer: "Навчальний DSS показує рекомендацію ризику, але не є офіційним рішенням банку."
rules:
  - id: "DSTI_SOFT_50"
    name: "DSTI soft indicator"
    description: "Демонстраційний поріг кредитної політики для навчального прототипу."
    type: "soft_flag"
    field: "dsti_after_new_loan"
    operator: ">"
    threshold: 50
    unit: "percent"
    reason: "DSTI після запитаного кредиту перевищує 50%."
    source: "Демонстраційне припущення прототипу; не регуляторна вимога."
    version: "2026.08-demo"
    user_message: "DSTI після нового кредиту перевищує демонстраційний поріг 50%."
  - id: "DSTI_HARD_65"
    name: "DSTI policy stop"
    description: "Демонстраційний поріг кредитної політики для навчального прототипу."
    type: "hard_stop"
    field: "dsti_after_new_loan"
    operator: ">"
    threshold: 65
    unit: "percent"
    reason: "DSTI після запитаного кредиту перевищує 65%."
    source: "Демонстраційне припущення прототипу; не регуляторна вимога."
    version: "2026.08-demo"
    user_message: "DSTI після нового кредиту перевищує демонстраційний поріг 65%."
  - id: "RESIDENCY_TERM_REVIEW"
    name: "Right-to-reside manual review"
    description: "Ручна перевірка, якщо право проживання не покриває весь строк кредиту."
    type: "hard_stop"
    field: "residency_covers_term"
    operator: "=="
    threshold: false
    unit: "boolean"
    reason: "Право проживання може не покривати повний строк кредиту."
    source: "Демонстраційне припущення прототипу."
    version: "2026.08-demo"
    user_message: "Потрібна ручна перевірка права проживання на весь строк кредиту."
  - id: "DISPOSABLE_INCOME_REVIEW"
    name: "Disposable income manual review"
    description: "Ручна перевірка, якщо вільний місячний дохід нижчий за демонстраційний мінімум."
    type: "hard_stop"
    field: "cash_left"
    operator: "<"
    threshold: 2000
    unit: "PLN"
    reason: "Вільний місячний дохід нижчий за демонстраційний мінімум."
    source: "Демонстраційне припущення прототипу."
    version: "2026.08-demo"
    user_message: "Вільний дохід після зобов’язань потребує ручної перевірки."
